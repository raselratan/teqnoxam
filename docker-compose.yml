services:
  exam_app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: exam_app_v2
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - exam_db
    networks:
      - exam_laravel_net

  exam_db:
    image: mysql:8.0
    container_name: exam_db_v2
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: exam_app
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysqldata_v2:/var/lib/mysql
    ports:
      - "3307:3306"  # 👈 Changed to avoid conflict with other MySQL containers
    networks:
      - exam_laravel_net

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin_v2
    restart: unless-stopped
    environment:
      PMA_HOST: exam_db_v2
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "8081:80"  # 👈 Different port from other phpMyAdmin instance
    depends_on:
      - exam_db
    networks:
      - exam_laravel_net

  nginx:
    image: nginx:alpine
    container_name: nginx_server_v2
    ports:
      - "8001:80"  # 👈 Different host port to avoid Nginx conflicts
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - exam_app
    networks:
      - exam_laravel_net

volumes:
  mysqldata_v2:

networks:
  exam_laravel_net:
    driver: bridge
